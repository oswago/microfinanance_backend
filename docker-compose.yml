version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: microfinance-postgres
    environment:
      POSTGRES_DB: microfinance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - microfinance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: microfinance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microfinance-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: microfinance-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JWT_SECRET: productionSecretKeyForMicrofinance2024ChangeMe
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microfinance-network
    restart: unless-stopped

  frontend:
    build: ../microfinance-frontend  # Adjust path to your Vue frontend
    image: microfinance-frontend:latest
    container_name: microfinance-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - microfinance-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:

networks:
  microfinance-network:
    driver: bridge
