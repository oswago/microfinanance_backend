# src/main/resources/application-dev.yml
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  datasource:
    url: jdbc:h2:mem:microfinancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  error:
    include-stacktrace: always
    include-message: always

logging:
  level:
    com.microfinance: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
  file:
    name: logs/microfinance-dev.log

app:
  security:
    jwt:
      secret: dev-secret-key-only-for-development-2024
  system:
    company-name: "Microfinance System - Development"
  file:
    upload-dir: uploads/documents
    max-size: 10485760  # 10MB in bytes
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document