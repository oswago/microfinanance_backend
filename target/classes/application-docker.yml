spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/microfinance
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update   # instead of update
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        schema_update.unique_constraint_strategy: SKIP
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

server:
  compression:
    enabled: true
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /management
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microfinance: INFO
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/microfinance-docker.log

app:
  system:
    company-name: "Finite System - Docker"
  file:
    upload-dir: /app/uploads